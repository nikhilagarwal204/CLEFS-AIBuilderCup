# Ask Clefs eval set (02 spec 7). Run by tests/modules/ask/test_evals.py
# against the demo registry (conftest.py) with today = 2026-09-29 in Dubai.
#
# Each item:
#   question   what the owner types
#   role       who asks (default owner)
#   call       what the model writes: m=metric, dims, f=[[field, op, value]],
#              p=preset or [from, to], grain, cmp=compare_to, sort, limit
#   calls      several planning rounds, each one call (a self-correcting model)
#   expect     the governed query that must run: m, dims, f={field: [values]},
#              from, to, grain (default total), cmp (default null), limit
#   answer     grounded (default) | hallucinate_once | hallucinate_twice
#   unsupported  guardrail (refused before any model call) | model (declined)
#
# Targets: tool-argument exact match >= 90%, numeric grounding 100%,
# unsupported questions detected >= 95%. With ASK_EVAL_LIVE=1 and a real
# GEMINI_API_KEY the same file measures the live planner (calls are ignored).

# ─── Profit Guard ───

- id: pg-01
  question: How much commission did Booking charge on taxes last month?
  call: {m: pg.commission_on_tax_aed, f: [[channel, eq, Booking.com]], p: last_month}
  expect: {m: pg.commission_on_tax_aed, f: {channel: [BOOKING]}, from: 2026-08-01, to: 2026-08-31}
- id: pg-02
  question: Net ADR by channel in August
  call: {m: pg.net_adr_aed, dims: [channel], p: [2026-08-01, 2026-08-31]}
  expect: {m: pg.net_adr_aed, dims: [channel], from: 2026-08-01, to: 2026-08-31}
- id: pg-03
  question: VCCs expiring in 14 days
  call: {m: pg.vcc_expiring_aed, p: next_14d}
  expect: {m: pg.vcc_expiring_aed, from: 2026-09-29, to: 2026-10-12}
- id: pg-04
  question: Total OTA commission last month
  call: {m: pg.commission_aed, p: last_month}
  expect: {m: pg.commission_aed, from: 2026-08-01, to: 2026-08-31}
- id: pg-05
  question: Commission by channel year to date
  call: {m: pg.commission_aed, dims: [channel], p: ytd}
  expect: {m: pg.commission_aed, dims: [channel], from: 2026-01-01, to: 2026-09-29}
- id: pg-06
  question: Expedia commission this month vs last month
  call: {m: pg.commission_aed, f: [[channel, eq, expedia]], p: mtd, cmp: previous_period}
  expect: {m: pg.commission_aed, f: {channel: [EXPEDIA]}, from: 2026-09-01, to: 2026-09-29, cmp: prev_period}
- id: pg-07
  question: How much did we pay Booking and Expedia in commission in Q3?
  call: {m: pg.commission_aed, f: [[channel, in, [Booking, Expedia]]], p: [2026-07-01, 2026-09-30]}
  expect: {m: pg.commission_aed, f: {channel: [BOOKING, EXPEDIA]}, from: 2026-07-01, to: 2026-09-30}
- id: pg-08
  question: Net revenue by channel last month
  call: {m: pg.net_revenue_aed, dims: [channel], p: last_month}
  expect: {m: pg.net_revenue_aed, dims: [channel], from: 2026-08-01, to: 2026-08-31}
- id: pg-09
  question: Direct net revenue this year
  call: {m: pg.net_revenue_aed, f: [[channel, eq, direct]], p: ytd}
  expect: {m: pg.net_revenue_aed, f: {channel: [DIRECT]}, from: 2026-01-01, to: 2026-09-29}
- id: pg-10
  question: How many money leaks were found this year, by channel?
  call: {m: pg.findings_open, dims: [channel], p: ytd}
  expect: {m: pg.findings_open, dims: [channel], from: 2026-01-01, to: 2026-09-29}
- id: pg-11
  question: Commission last year
  call: {m: pg.commission_aed, p: last_year}
  expect: {m: pg.commission_aed, from: 2025-01-01, to: 2025-12-31}
- id: pg-12
  question: VCC amounts expiring in the next 90 days by channel
  call: {m: pg.vcc_expiring_aed, dims: [channel], p: next_90d}
  expect: {m: pg.vcc_expiring_aed, dims: [channel], from: 2026-09-29, to: 2026-12-27}
- id: pg-13
  question: Agoda commission last month
  calls:
    - {m: pg.commission_aed, f: [[channel, eq, Agoda]], p: last_month}
    - {m: pg.commission_aed, dims: [channel], p: last_month}
  expect: {m: pg.commission_aed, dims: [channel], from: 2026-08-01, to: 2026-08-31}
- id: pg-14
  question: Commission last month, and be precise
  call: {m: pg.commission_aed, p: last_month}
  answer: hallucinate_twice
  expect: {m: pg.commission_aed, from: 2026-08-01, to: 2026-08-31}

