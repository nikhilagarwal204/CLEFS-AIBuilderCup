# Source: docs/specs/research/uae/events-demand.md (gathered 2026-09-27).
#
# Rules:
# - Every row carries source_url and last_verified_at.
# - verification UNVERIFIED marks dates not confirmed by a primary source
#   (DSF is not announced yet; projected Hijri dates).
# - Hijri holidays carry moon_dependent: true and uncertainty_days: 1 (Canon:
#   week and demand calendar), because the date follows the moon sighting.
# - `key` is the stable external id of the row: never rename one, or the
#   sync creates a second event instead of updating the first.
# - Venue coordinates are approximate (coords_verified: false) until checked
#   on a map; the corridor tags drive the relevance corridor bonus.
# - The job dr.curated_verify_reminder lists rows whose last_verified_at is
#   older than a quarter, so this file is re-checked every season.

