# Russian safety lexicon. Format: see en.yml. Stems end in \w* where the
# word inflects; stems that would swallow unrelated words are spelled out
# ("драка", not "драк\w*", which would match "дракон").
language: ru
boundary: word
kinds:
  medical:
    patterns:
      - скор(ая|ую|ой) помощ\w*
      - вызовите скорую
      - сердечный приступ
      - инфаркт
      - инсульт
      - не дыш\w*
      - задыха\w*
      - (трудно|тяжело) дышать
      - без сознания
      - (потерял|потеряла|потеряли) сознание
      - обморок
      - кровотечени\w*
      - (сильно )?кровоточ\w*
      - судорог\w*
      - эпилепти\w*
      - аллергическ\w* реакци\w*
      - анафилак\w*
      - (нужен|нужна|вызовите) (врач|врача|доктор|доктора)
      - отравлени\w*
      - тонет
      - утонул\w*
  fire:
    patterns:
      - пожар\w*
      - горит
      - горим
      - огонь
      - дым
      - дыма
      - дымом
      - задымлени\w*
      - (запах|пахнет) (газа|газом|гари|гарью|дымом)
      - утечка газа
      - что-то горит
      - пламя
    guards:
      - пожарн\w* (выход|лестниц\w*|учени\w*|тревог\w* проверк\w*)
      - (свет|лампа|лампочка|индикатор|огонёк|огонек) (горит|не горит)
      - горит (свет|лампа|лампочка|индикатор)
      - бенгальск\w* огонь
  sparks_flooding:
    patterns:
      - искр(а|ы|ит|ят|ами)
      - (ударило|бьёт|бьет|ударил\w*) током
      - (оголённ|оголенн)\w* провод\w*
      - затоп\w*
      - потоп
      - прорвало трубу
      - прорыв трубы
      - вода (везде|повсюду)
      - (течёт|течет|льёт|льет) с потолка
      - потолок (рушится|обвалился|падает)
  violence:
    patterns:
      - напал\w*
      - нападени\w*
      - избива\w*
      - (бьёт|бьет|ударил|ударила|ударили) меня
      - угрожа\w*
      - пистолет\w*
      - оружи\w*
      - с ножом
      - убь(ю|ёт|ет|ют)
      - убить
      - бомб(а|у|ой|ы)
      - стрельб\w*
      - стреляют
      - ножев\w* ранени\w*
      - изнасил\w*
      - драка
      - драку
      - дерутся
      - взлом\w*
      - ворвал\w*
  missing_child:
    patterns:
      - (ребёнок|ребенок|сын|дочь|дочка|малыш|дети) (пропал\w*|потерял\w*|исчез\w*)
      - (пропал|пропала|пропали|исчез|исчезла) (ребёнок|ребенок|сын|дочь|дочка|малыш|дети)
      - не (могу|можем) найти (ребёнка|ребенка|сына|дочь|детей|малыша)
      - (потерял|потеряла|потеряли) (ребёнка|ребенка|сына|дочь|детей)
  death:
    patterns:
      - умер\w*
      - (мёртв|мертв)\w*
      - труп
      - скончал\w*
      - самоубийств\w*
      - покончить с собой
      - хочу умереть
    guards:
      - (телефон|батарея|батарейка|аккумулятор|пульт|зарядка) (умер\w*|сел\w*|мёртв\w*|мертв\w*)
      - умер\w* со смеху
  lift_entrapment:
    patterns:
      - (застрял|застряла|застряли|заперт\w*) в лифте
      - лифт застрял
      - лифт остановился между этажами
  drugs:
    patterns:
      - наркот\w*
      - кокаин\w*
      - героин\w*
      - марихуан\w*
      - гашиш\w*
  harassment:
    patterns:
      - домогал\w*
      - домогател\w*
      - пристаёт
      - пристает
      - пристава\w*
      - лапал\w*
      - (трогал|трогала|трогали) меня
      - сексуальн\w* (домогател\w*|насили\w*)
      - (преследует|следит за) мной
      - скрыт\w* камер\w*
  theft:
    patterns:
      - (украл|украли|украла|украдено|украден\w*)
      - краж\w*
      - вор
      - воры
      - (ограбил\w*|ограблени\w*|обокрали)
      - пропал\w* из (номера|сейфа|сумки)
  lost_document:
    patterns:
      - (потерял|потеряла|потеряли) (паспорт|документы|удостоверение|визу)
      - паспорт (пропал|потерян|украли|украден)
  police:
    patterns:
      - полици\w*
      - полицейск\w*
  legal:
    patterns:
      - адвокат\w*
      - юрист\w*
      - (подам|подадим|подать) в суд
      - судебн\w*
  chargeback:
    patterns:
      - чарджб(э|е)к
      - оспор\w* (платёж|платеж|списание|оплату)
      - двойное списание
      - списали дважды
      - (позвоню|обращусь) в банк
  refund:
    patterns:
      - возврат\w* (денег|средств)
      - (вернуть|верните) (деньги|оплату)
      - компенсаци\w*
  complaint:
    patterns:
      - жалоб\w*
      - пожаловат\w*
      - (позовите|позвать|позвоните) (менеджера|управляющего|администратора)
      - (ужасн|отвратительн)\w* (обслуживани\w*|сервис\w*|отел\w*)
      - неприемлем\w*
