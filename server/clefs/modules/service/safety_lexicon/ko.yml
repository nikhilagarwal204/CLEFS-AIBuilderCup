# Korean safety lexicon. Format: see en.yml. Korean particles and endings
# attach to the word (불이 났어요, 엘리베이터에 갇혔어요), so patterns match as
# substrings (boundary: none) and carry the particle or the ending that
# makes them specific; " ?" allows the space guests often drop. Never a
# bare 불 (불편, 불고기, 불을 켜다: the light), 연기 (also "postpone":
# 체크아웃 연기), 총 (also "total"), 칼 (a knife for the cake), 강도 (also
# "intensity") or 고소 (고소한 맛: nutty, savoury). The guards carry the
# idioms and hotel questions: 화재 시 대피 (in case of fire), 마약김밥 (a
# dish), 폰이 죽었어요 (a flat phone), 근처 경찰서 (the nearest police station).
# Written by a non-native speaker: have a native speaker review it.
language: ko
boundary: none
kinds:
  medical:
    patterns:
      - 구급차
      - 구급대
      - (?<!\d)119(에|를|로|번)? ?(불러|전화|신고|연락)
      - 심장 ?마비
      - 심장 ?발작
      - 심근경색
      - 뇌졸중
      - 뇌경색
      - 가슴이 (너무 )?(아파|아프|답답|조여)
      - 숨을 ?(못|안) ?쉬
      - 숨을 ?쉴 ?수 ?(가 )?없
      - 숨이 ?(안|막혀|막히|가빠)
      - 숨 ?쉬기가? ?(힘들|어려|곤란)
      - 호흡(이)? ?(곤란|없|멈|정지)
      - 의식이 ?(없|없어|돌아오지)
      - 의식을 ?잃
      - 정신을 ?잃
      - 기절
      - 실신
      - (사람|누가|남편|아내|와이프|아이|애|아들|딸|아버지|어머니|아빠|엄마|할아버지|할머니|친구|손님|남자|여자|동료|일행)(이|가)? ?(갑자기 )?쓰러
      - 쓰러져서 ?(움직이|일어나|의식|대답|반응)
      - 넘어져서 ?(못 일어나|일어날 수 없|움직일 수 없|못 움직)
      - 경련
      - 발작
      - 피가 ?(멈추지|안 멈|너무 많이|많이 나|철철)
      - (과다 ?)?출혈
      - 알레르기 ?반응
      - 아나필락시스
      - 질식
      - 목에 ?(뭐가 |음식이 )?걸려(서)? ?(숨|말)
      - (사람|누가|아이|애|아기|남편|아내|아들|딸|친구|아버지|어머니|엄마|아빠)(이|가)? ?물에 ?빠
      - 물에 ?빠져 ?(허우적|숨)
      - 익사
      - 중독
      - 과다 ?복용
      - 의사(를|가)? ?(불러|필요|좀 불러|와)
      - 머리를 ?(다쳤|부딪|박았|세게)
      - 뼈가 ?부러
      - 골절
    guards:
      - 구급 ?(상자|함|약)
      - (게임|커피|카페인|일|쇼핑|스마트폰|폰|운동|설탕|초콜릿|술) ?중독
      - 중독성
      - 기절할 ?(만큼|정도)
      - 기절초풍
      - 구급차 ?(사이렌|소리)
  fire:
    patterns:
      - 불이 ?(났|나서|나고 있)
      - 불이 ?(붙었|붙어서)
      - 불났
      - 화재
      - 불길
      - (불|불꽃)이 ?(번지|커지|올라)
      - 연기가 ?(나|많이|가득|차|올라|들어|새어)
      - 연기 ?냄새
      - (타는|탄) ?냄새
      - 가스 ?(냄새|누출|가 새|새요|새는)
      - 일산화탄소
      - 화재 ?경보(기)?(가|이)? ?울
      - 폭발
    guards:
      - 화재 ?(시|발생 ?시|가 나면|나면|날 때|대피|훈련|보험|비상구|점검|예방)
      - 화재 ?(경보기|감지기) ?(점검|테스트|배터리|건전지)
      - 폭발적
      - (화가|분노가?|짜증이?) ?폭발
      - 불길(한|하)
      - 불꽃 ?놀이
      - (담배|전자담배|향|바비큐|고기 굽는) ?연기
  sparks_flooding:
    patterns:
      - 불꽃이 ?튀
      - 스파크
      - 감전
      - 누전
      - 전기가 ?(통해|오르|흘러|찌릿)
      - 찌릿찌릿
      - 전선이 ?(드러나|노출|벗겨|끊어)
      - 침수
      - 물바다
      - 홍수
      - 물이 ?(넘쳐|넘치|쏟아|흘러넘|차올라|차 올라)
      - 천장에서 ?물이
      - 천장이 ?(무너|내려앉|떨어|주저앉)
      - (수도관|배관|파이프)(이|가)? ?(터졌|터져|파열)
    guards:
      - 홍수 ?(경보|주의보)
  violence:
    patterns:
      - 폭행
      - 폭력
      - 구타
      - 때렸
      - 때리(고|는|려)
      - 공격(당|을 받|했|하고)
      - (칼|흉기|칼로|칼을)(에|로)? ?찔
      - (칼|흉기)(을|를)? ?(휘두르|휘둘|겨누|들이대)
      - 칼을 ?든 ?(남자|여자|사람|놈)
      - 흉기
      - 총을 ?(들|쏘|쐈|겨누)
      - 총으로 ?(쏘|쐈|위협)
      - 총 ?(쏘|쐈)
      - 총기
      - 총소리
      - 총에 ?맞
      - 총격
      - 협박
      - 위협
      - 죽여 ?버리
      - 죽이겠
      - 죽일 ?(거|게|테)
      - 죽이려(고|해)
      - 살인
      - 폭탄
      - 인질
      - 침입자
      - 침입(했|해|당)
      - 강도(를 당|당했|한테|에게|가 들)
      - 성폭행
      - 강간
      - 싸움이 ?(났|나|벌어)
      - 싸우고 ?있
      - 몸싸움
    guards:
      - 폭탄 ?(세일|주|할인)
      - 시간(을)? ?죽이
      - 살인적
  missing_child:
    patterns:
      - (아이|애|아들|딸|아기|애기|손주|우리 애|우리 아이)(가|를|이)? ?(없어졌|사라졌|안 보여|안 보이|보이지 않|찾을 수 없|못 찾|실종|잃어버렸)
      - (아이|애|아들|딸|아기|애기)(를|을)? ?잃어버렸
      - 미아가 ?(됐|되었)
      - 미아 ?신고
  death:
    patterns:
      - 죽었
      - 죽어 ?있
      - 숨졌
      - 숨을 ?거뒀
      - 사망
      - 시체
      - 시신
      - 자살
      - 죽고 ?싶
      - 목숨을 ?끊
    guards:
      - (핸드폰|휴대폰|휴대전화|폰|배터리|노트북|컴퓨터|와이파이|인터넷|TV|티비|리모컨|전구|꽃|식물|화분)(이|가)? ?(다 |완전히 |또 )?죽었
      - (창피해서|부끄러워서|민망해서|쪽팔려서) ?죽고 ?싶
  lift_entrapment:
    patterns:
      - (엘리베이터|승강기)(에|안에| 안에|에서)? ?갇(혔|혀)
      - (엘리베이터|승강기)(가)? ?(층 ?사이에|중간에)(서)? ?멈
      - (엘리베이터|승강기)(에서|안에서)? ?(못 나가|나갈 수 없|못 나와|나올 수 없)
  drugs:
    patterns:
      - 마약
      - 대마
      - 마리화나
      - 코카인
      - 헤로인
      - 필로폰
      - 히로뽕
      - 각성제
    guards:
      - 마약 ?(김밥|떡볶이|옥수수|빵|토스트|베개|쿠션|계란|달걀|소스|치킨|라면)
      - 대마도
  # ─── Sensitive: urgent, a person now, no public-number card ───
  harassment:
    patterns:
      - 성희롱
      - 성추행
      - 추행
      - 희롱
      - 괴롭히
      - 괴롭혀
      - 괴롭힘
      - (몸|가슴|엉덩이|다리|허벅지)(을|를)? ?(만졌|만지)
      - 스토킹
      - 스토커
      - 따라다니
      - 따라다녀
      - 몰래 ?카메라
      - 몰카
      - 몰래 ?찍
      - 훔쳐보
      - 노출증
      - 성적인 ?(말|농담|행동|발언)
  theft:
    patterns:
      - 도난
      - 도둑
      - 훔쳐
      - 훔쳤
      - 소매치기
      - 날치기
      - 털렸
      - (방|금고|가방|캐리어|짐)(에서|안에서) ?(지갑|돈|현금|귀중품|시계|노트북|카메라|보석|반지|목걸이|여권|카드|핸드폰|휴대폰|물건)(이|가)? ?(없어졌|사라졌)
      - 금고가 ?(열려 있|부서|비어)
      - 누가 ?(제|내)? ?(지갑|돈|현금|귀중품|시계|노트북|카메라|보석|가방|여권|카드|핸드폰|휴대폰|물건)(을|를)? ?(가져갔|훔쳐)
  lost_document:
    patterns:
      - (여권|신분증|외국인 ?등록증|운전 ?면허증|면허증|비자)(을|를|이|가)? ?(잃어버렸|분실|없어졌|못 찾|찾을 수 없|도난)
      - 여권 ?분실
  police:
    patterns:
      - 경찰
      - (?<!\d)112(에|로)? ?(신고|전화)
      - 파출소
      - 범죄 ?신고
    guards:
      - (근처|가까운|가장 가까운|제일 가까운) ?(경찰서|파출소)
      - (경찰서|파출소)(가|는)? ?(어디|가까|근처|몇 분)
      - 경찰 ?(드라마|영화)
      - 경찰차? ?(사이렌|소리)
  # ─── Handoff: a manager takes over; the assistant promises nothing ───
  legal:
    patterns:
      - 변호사
      - 소송
      - 고소(하겠|할 거|할게|하겠습니다|장)
      - 법적 ?(조치|대응|책임|절차)
      - 재판(을|에)
  chargeback:
    patterns:
      - 차지백
      - (카드사|카드 회사|은행)에 ?(연락|전화|이의|신고)
      - (이중|중복) ?(결제|청구|과금)
      - 두 ?번 ?(결제|청구)
      - 과다 ?(청구|결제|과금)
      - 결제 ?이의
      - (승인되지|허락하지) ?않은 ?(결제|거래)
  refund:
    patterns:
      - 환불
      - 돈 ?(을|를)? ?돌려
      - 보상
      - 배상
      - 변상
    guards:
      - 환불 ?불가
  complaint:
    patterns:
      - 컴플레인
      - 불만
      - 항의
      - 민원
      - (매니저|지배인|책임자|담당자|상사)(를|랑|와|하고|님)? ?(불러|바꿔|만나|얘기|이야기|통화)
      - 최악
      - (정말|너무|매우|아주) ?실망
      - 다시는 ?(안 올|오지 않|안 묵|묵지 않|이용 안|이용하지 않)
      - (나쁜|안 좋은|최악의) ?(리뷰|후기|평점)
      - 용납할 ?수 ?없
    guards:
      - 불만 ?(없|은 없|이 없|은 하나도)
      - 최악의 ?(경우|상황에는)
