# Japanese safety lexicon. Format: see en.yml. Japanese has no spaces, so
# patterns match as substrings (boundary: none, like Chinese) and are
# spelled out far enough not to land inside an everyday word: never a bare
# 炎 (炎症, inflammation), 煙 (禁煙, non-smoking), スリ (スリッパ, slippers),
# 押し入 (押し入れ, the futon closet), ナイフ (ナイフとフォーク), 迷子 (an adult
# lost in the station) or 刺され (蚊に刺された, a mosquito bite).
# The guards carry the hotel questions and idioms that would otherwise
# fire: 火災の時は (in case of fire), 燃えるゴミ (burnable rubbish),
# 電池が死んだ (a flat battery), ドラッグストア (a pharmacy), クレームブリュレ
# (a dessert), 最寄りの交番はどこ (where is the police box).
# A text with kana is not read by the Chinese lexicon (safety.languages_for),
# so these guards also keep its 警察 and 火災 quiet on Japanese questions.
# Written by a non-native speaker: have a native speaker review it.
language: ja
boundary: none
kinds:
  medical:
    patterns:
      - 救急車
      - 救急隊
      - (?<!\d)119番
      - 心臓発作
      - 心筋梗塞
      - 脳卒中
      - 脳梗塞
      - 胸が(痛|苦し)
      - 胸の痛み
      - 息が(でき|出来)(ない|ません)
      - 息が苦し
      - (息|呼吸)を?して(い)?(ない|ません)
      - 呼吸が(でき|出来|苦し|止ま|おかし)
      - 呼吸(困難|停止)
      - 意識が(ない|ありません|戻らない|もうろう)
      - 意識不明
      - 意識を失
      - 気を失
      - 気絶
      - 失神
      - (人|誰か|夫|妻|主人|旦那|嫁|家内|子供|子ども|息子|娘|父|母|お父さん|お母さん|祖父|祖母|おじいさん|おばあさん|友人|友達|男性|女性|男の人|女の人|彼|彼女|お客さん|お客様|同僚|連れ)が倒れ
      - 倒れて(動かない|動きません|意識|起き上がれ|返事)
      - (転んで|倒れて)(動けない|動けません|立てない|立てません|起き上がれない)
      - (呼んでも|呼びかけても|声をかけても|揺すっても)反応が(ない|ありません)
      - (けいれん|痙攣|ひきつけ)
      - 発作
      - 出血が(止まらない|止まりません|ひどい)
      - 血が(止まらない|止まりません)
      - (大量|ひどい)出血
      - 大量の血
      - アレルギー反応
      - アナフィラキシー
      - 喉に詰ま
      - 窒息
      - 溺れ
      - 中毒
      - 過剰摂取
      - オーバードーズ
      - (医者|医師|お医者さん)(を|に)?(呼んで|来て|が必要|に診てもらいたい)
      - 頭を(打|強く打)
      - 骨折
    guards:
      - 救急(箱|セット|バッグ)
      - 発作的
      - (スマホ|ゲーム|仕事|活字|ネット|買い物|コーヒー|カフェイン|チョコ|チョコレート|甘い物|お酒)中毒
      - 中毒性
      - 骨折り
      - 救急車の(サイレン|音)
  fire:
    patterns:
      - 火事
      - 火災
      - 出火
      - 発火
      - 火が出(た|て|まし)
      - 火の手
      - 炎が(出て|出た|上が|見え)
      - 燃えて(いる|る|います|いて)
      - 何か(が)?燃えて
      - 煙が(出|充満|上が|立ち|入って|こもって|すごい)
      - 煙(い|たい|臭)
      - 焦げ(臭|くさ)
      - (ガス|ガソリン)(の)?(におい|臭い|匂い)
      - ガス臭
      - ガス漏れ
      - 一酸化炭素
      - 火災報知器が鳴
      - 爆発
    guards:
      - (火災|火事)(の時|の際|のとき|時|が起きたら|が起こったら|になったら|発生時|の場合)
      - (火災|火事|避難)(訓練|保険)
      - (火災|防災|避難)(経路|マップ)
      - 火災報知器の(電池|テスト|点検|ピーピー)
      - 燃える(ゴミ|ごみ)
      - 燃えないゴミ
      - 禁煙
      - 喫煙
      - 分煙
      - (タバコ|たばこ|煙草|電子タバコ|葉巻|線香|お香|バーベキュー|BBQ|焼肉)の煙
      - 爆発的
      - (怒り|ストレス)が爆発
  sparks_flooding:
    patterns:
      - 火花
      - スパーク
      - 感電
      - (コンセント|電気|スイッチ|ドアノブ|蛇口|シャワー)(が|で|から)?ビリビリ
      - 漏電
      - (電気|コンセント|配線)がショート
      - (電線|配線|コード)が(むき出し|切れて|露出)
      - むき出しの(電線|配線|コード)
      - 浸水
      - 水浸し
      - 洪水
      - 水が(溢れ|あふれ)
      - 水漏れが(ひどい|止まらない)
      - 天井から水
      - 天井が(落ち|崩れ|抜け)
      - (水道管|配管|パイプ)が破裂
    guards:
      - 線香花火
      - 洪水(警報|注意報|ハザード)
  violence:
    patterns:
      - 襲われ
      - 襲って(き|く)
      - 暴行
      - 暴力
      - 殴られ
      - 殴って(き|く)
      - 蹴られ
      - 刺され
      - (ナイフ|刃物|包丁|凶器)を(持|振り回|突きつけ|向け)
      - 凶器
      - 拳銃
      - 銃(を|で|声|撃)
      - 発砲
      - 撃たれ
      - 脅され
      - 脅迫
      - 殺(す|される|された|して|しそう|そう)
      - 爆弾
      - 人質
      - 侵入者
      - 侵入(され|し)
      - 不審者
      - 押し入(られ|って来|ってき|った)
      - 強盗
      - レイプ
      - 強姦
      - (喧嘩|けんか|ケンカ)(して|が起き|になっ|が始ま)
      - 殴り合い
    guards:
      - (蚊|虫|蜂|ハチ|ダニ|ノミ|クラゲ|ブヨ|アブ|南京虫)に刺され
      - 爆弾(おにぎり|発言|低気圧)
      - 殺(虫|菌)
      - 押し入れ
      - 息を殺
  missing_child:
    patterns:
      - (子供|子ども|こども|息子|娘|赤ちゃん|うちの子|孫)(が|は|を)?(どこにも)?(いなくなっ|いなくなり|見当たら|見当たり|見つから|見つかり|迷子|行方不明)
      - (子供|子ども|こども|息子|娘|赤ちゃん)を見失
  death:
    patterns:
      - 死んで(いる|る|います|しまっ)
      - 死んじゃ(った|う)
      - 死んだ
      - 亡くな(っ|り)
      - 息を引き取
      - 遺体
      - 死体
      - 自殺
      - 死にたい
      - 命を絶
      - 首を(吊|つ)(る|ろう|った)
    guards:
      - (携帯|スマホ|電池|バッテリー|充電|パソコン|PC|テレビ|リモコン|Wi-Fi|ネット|エアコン|電球)(が|は)?(死んだ|死んでる|死んでいる|死んじゃった|死にそう)
      - 死んだように
      - (恥ずかしくて|恥ずかしすぎて)死にたい
      - 死にたい(くらい|ほど)
  lift_entrapment:
    patterns:
      - (エレベーター|エレベータ|リフト)(に|の中に|の中で|内に|で)?(閉じ込め|閉じこめ|とじこめ)
      - (エレベーター|エレベータ)が(階の間|途中|階と階の間)で(止ま|停止)
      - (エレベーター|エレベータ)(から|が)(出られない|出られません|開かない|開きません)
      - (エレベーター|エレベータ)が止まって(出られ|開か)
  drugs:
    patterns:
      - 麻薬
      - 覚醒剤
      - 覚せい剤
      - 大麻
      - マリファナ
      - コカイン
      - ヘロイン
      - 違法薬物
      - 危険ドラッグ
      - ドラッグ
      - (薬物|ドラッグ)の売人
    guards:
      - ドラッグ(ストア|・ストア|&|アンド)
  # ─── Sensitive: urgent, a person now, no public-number card ───
  harassment:
    patterns:
      - セクハラ
      - ハラスメント
      - 嫌がらせ
      - 痴漢
      - (体|胸|お尻|尻|足|太もも|身体)を触られ
      - (つきまとわれ|付きまとわれ|つきまとって)
      - ストーカー
      - 後をつけられ
      - 盗撮
      - 隠しカメラ
      - 覗かれ
      - のぞかれ
      - 露出狂
      - わいせつ
      - 性的な(発言|嫌がらせ|いやがらせ|行為|言葉)
  theft:
    patterns:
      - 盗まれ
      - 盗難
      - 盗んだ
      - 盗った
      - 泥棒
      - 空き巣
      - ひったくり
      - 置き引き
      - スリに(遭|あ)
      - スリ被害
      - (部屋|金庫|セーフティボックス|かばん|カバン|バッグ|荷物|スーツケース)(の中)?から(財布|お金|現金|貴重品|時計|パソコン|カメラ|宝石|指輪|ネックレス|物|もの|パスポート|カード|スマホ|携帯)(が|を)?(なくなっ|無くなっ|消え|盗)
      - 金庫が(開けられ|壊され|空っぽ)
      - 誰かが(私|僕|俺|わたし|自分)?の?(財布|お金|現金|貴重品|時計|パソコン|カメラ|宝石|荷物|かばん|カバン|バッグ|パスポート|カード|スマホ|携帯)を(取|盗|持って行|持っていか)
  lost_document:
    patterns:
      - (パスポート|旅券|在留カード|身分証|身分証明書|運転免許証|免許証|ビザ|査証)(を|が)?(なくし|無くし|失くし|紛失|落とし|なくなっ|無くなっ|見つから|見当たら|盗まれ|見つかり|見当たり)
      - (パスポート|旅券|在留カード|身分証)の紛失
  police:
    patterns:
      - 警察
      - 警官
      - おまわりさん
      - (?<!\d)110番
      - 交番
      - 被害届
    guards:
      - (近くの|最寄りの|最寄り|一番近い)(警察署|交番)
      - (警察署|交番)(は|って)?(どこ|どちら|近く|何分|場所|行き方)
      - (警察署|交番)(まで|への行き方|の場所|の電話番号)
      - 警察(ドラマ|24時)
      - (警察|パトカー)の(サイレン|音)
  # ─── Handoff: a manager takes over; the assistant promises nothing ───
  legal:
    patterns:
      - 弁護士
      - 訴え(る|ます|てやる)
      - 訴訟
      - 法的(措置|手段|対応|手続き)
      - 裁判(に|を|で|沙汰)
      - 告訴
    guards:
      - (痛み|腹痛|頭痛|不調|症状|苦痛|吐き気)を訴え
  chargeback:
    patterns:
      - チャージバック
      - (カード会社|クレジットカード会社|銀行)に(連絡|電話|異議|相談|申し立て)
      - 二重(請求|決済|引き落とし)
      - 請求が二重
      - 不正(請求|利用)
      - 身に覚えのない(請求|引き落とし|決済)
      - 過剰請求
      - 請求額が(違う|間違|おかしい)
  refund:
    patterns:
      - 返金
      - 払い戻し
      - (お金|代金|料金)を返して
      - 補償
      - 賠償
      - 弁償
    guards:
      - (返金|払い戻し)(不可|できない(プラン|料金))
  complaint:
    patterns:
      - 苦情
      - クレーム
      - 文句
      - (責任者|マネージャー|支配人|上司|上の人)を(呼んで|出して|お願い)
      - (責任者|マネージャー|支配人|上の人)と話(したい|させて)
      - 最悪
      - 納得できない
      - 二度と(来ない|来ません|泊まらない|泊まりません|利用しない)
      - (悪い|最低の)(口コミ|レビュー|評価)
      - (本当に|とても|すごく|非常に)(がっかり|不満)
    guards:
      - 文句(なし|は?ない|はありません|の付けようがない|のつけようがない)
      - 苦情(は|も)?(ない|ありません)
      - 最悪(の場合|でも|の事態|のケース)
      - クレーム(ブリュレ|・ブリュレ|ダンジュ|シャンティ|パティシエール)
