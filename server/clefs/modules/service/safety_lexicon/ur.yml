# Urdu safety lexicon (Nastaliq script). Format: see en.yml. Urdu shares the
# Arabic script, so both files read Arabic-script text; patterns here are
# Urdu words and phrases (postpositions are separate words: "آگ لگ گئی").
language: ur
boundary: word
kinds:
  medical:
    patterns:
      - ایمبولینس
      - دل کا دورہ
      - ہارٹ اٹیک
      - سانس (نہیں|نہی) (لے|آ)
      - سانس لینے میں (تکلیف|دشواری|مشکل)
      - (بے ہوش|بیہوش)
      - خون بہہ
      - دورہ پڑ
      - مرگی
      - ڈاکٹر (چاہیے|بلائیں|بلاؤ|کو بلائیں)
      - زہر
  fire:
    patterns:
      - آگ
      - دھواں
      - گیس (لیک|کی بو)
      - (جل رہا|جل رہی|جل رہے)
  sparks_flooding:
    patterns:
      - چنگاری
      - کرنٹ (لگ|مار)
      - بجلی کا جھٹکا
      - ننگی تار
      - سیلاب
      - پانی بھر گیا
      - پائپ پھٹ
  violence:
    patterns:
      - حملہ
      - (مار رہا|مار رہی|مارا|پیٹ رہا|پیٹ رہی|پیٹا)
      - دھمکی
      - (بندوق|پستول)
      - چاقو (سے|لے کر|دکھا)
      - گولی (چل|چلا|مار|ماری)
      - بم
      - (زیادتی|ریپ)
      - (لڑائی|جھگڑا) (ہو رہی|ہو رہا|کر رہے)
      - جان سے مار
  missing_child:
    patterns:
      - (میرا|ہمارا) (بچہ|بیٹا) (کھو|گم|لاپتہ)
      - (میری|ہماری) (بچی|بیٹی) (کھو|گم|لاپتہ)
      - (بچہ|بچی|بیٹا|بیٹی) (نہیں مل|لاپتہ|گم)
  death:
    patterns:
      - (مر گیا|مر گئی)
      - موت ہو (گئی|گیا)
      - (کی|کا) موت
      - لاش
      - خودکشی
      - (مرنا چاہتا|مرنا چاہتی)
    guards:
      - (فون|بیٹری|موبائل|ریموٹ) (مر گیا|مر گئی)
  lift_entrapment:
    patterns:
      - لفٹ میں (پھنس|اٹک)
      - لفٹ (رک|اٹک) گئی
  drugs:
    patterns:
      - منشیات
      - ڈرگز
      - چرس
      - کوکین
      - ہیروئن
  harassment:
    patterns:
      - (ہراساں|ہراسانی|ہراسمنٹ)
      - چھیڑ
      - غلط طریقے سے چھو
      - پیچھا کر
  theft:
    patterns:
      - چوری
      - (چرا لیا|چرا لیے|چرایا)
      - چور
  lost_document:
    patterns:
      - پاسپورٹ (کھو|گم|چوری|نہیں مل)
      - شناختی کارڈ (کھو|گم|چوری)
  police:
    patterns:
      - پولیس
  legal:
    patterns:
      - وکیل
      - (عدالت|کورٹ)
      - مقدمہ
  chargeback:
    patterns:
      - چارج بیک
      - دو بار پیسے کٹ
      - بینک میں شکایت
  refund:
    patterns:
      - ریفنڈ
      - پیسے واپس
      - معاوضہ
  complaint:
    patterns:
      - شکایت
      - مینیجر (سے بات|کو بلا)
      - بہت برا
