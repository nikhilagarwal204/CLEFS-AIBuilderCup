# Thai safety lexicon. Format: see en.yml. Thai writes words without
# spaces, so patterns match as substrings (boundary: none) and are spelled
# out to whole phrases: never a bare ไหม้ (ข้าวไหม้, burnt rice), ควัน
# (ควันบุหรี่, cigarette smoke), ชัก (ชักโครก, the toilet), หมอ (หมอน, a pillow;
# หมอนวด, a masseur), มีด (a knife for the cake), ตาย (ตายแล้ว! is "oh no!"),
# ฆ่า (ฆ่าเชื้อ, disinfect) or ศาล (ศาลเจ้า, a shrine). Python's \w does not
# cover Thai vowel and tone marks, so patterns spell their words out
# instead of using \w. The guards carry the idioms and hotel questions:
# หิวจะตาย (starving), กรณีไฟไหม้ (in case of fire), แบตตาย (a flat battery),
# สถานีตำรวจที่ใกล้ที่สุด (the nearest police station).
# Written by a non-native speaker: have a native speaker review it.
language: th
boundary: none
kinds:
  medical:
    patterns:
      - รถพยาบาล
      - รถฉุกเฉิน
      - (?<!\d)1669(?!\d)
      - หัวใจ(วาย|ล้มเหลว|หยุดเต้น)
      - (เส้นเลือดในสมอง|หลอดเลือดสมอง)(แตก|ตีบ|อุดตัน)
      - หายใจไม่(ออก|ได้)
      - หายใจ(ลำบาก|ติดขัด)
      - ไม่หายใจ
      - หมดสติ
      - ไม่ได้สติ
      - ไม่รู้สึกตัว
      - เป็นลม(หมดสติ)?
      - (ล้ม|ฟุบ)(ลง)?(แล้ว)?(ไม่|หมด)(ขยับ|ตอบ|ฟื้น|สติ)
      - ล้มแล้วลุกไม่ขึ้น
      - (ชักกระตุก|อาการชัก|ลมชัก|กำลังชัก)
      - เลือด(ออก|ไหล)(มาก|ไม่หยุด|เยอะ)
      - ตกเลือด
      - (แพ้อย่างรุนแรง|อาการแพ้รุนแรง|แพ้รุนแรง)
      - สำลัก
      - (อาหาร|ก้าง|ก้างปลา|กระดูก|ขนม|ลูกอม|เม็ดยา)ติดคอ
      - จมน้ำ
      - (อาหารเป็นพิษ|ได้รับสารพิษ)
      - (กินยาเกินขนาด|ยาเกินขนาด)
      - (ต้องการ|เรียก|ตาม|ขอ)(คุณ)?หมอ(?!น)
      - (หัว|ศีรษะ)(กระแทก|ฟาด)
      - กระดูกหัก
    guards:
      - ปลอดสารพิษ
      - เสียง(ไซเรน)?(ของ)?รถพยาบาล
  fire:
    patterns:
      - ไฟไหม้
      - เพลิงไหม้
      - อัคคีภัย
      - (มี|เกิด)ไฟลุก
      - ไฟลุก
      - ไฟลาม
      - กำลังไหม้
      - ไหม้อยู่
      - ควัน(ขึ้น|ออก|เต็ม|โขมง|ลอย|เข้ามา)
      - มีควัน
      - กลิ่น(ไหม้|ควัน|แก๊ส|แก๊ซ)
      - (แก๊ส|แก๊ซ)รั่ว
      - คาร์บอนมอนอกไซด์
      - สัญญาณ(เตือน)?(ไฟไหม้|เพลิงไหม้)ดัง
    guards:
      - (กรณี|เวลา|ถ้า|หาก|เมื่อ)(มี|เกิด)?(ไฟไหม้|เพลิงไหม้|อัคคีภัย)
      - ซ้อม(หนี)?(ไฟ|ไฟไหม้|อัคคีภัย)
      - ประกันอัคคีภัย
      - ทดสอบ(สัญญาณ)?(เตือน)?(ไฟไหม้|เพลิงไหม้|อัคคีภัย)
      - (มี)?ควัน(บุหรี่|ธูป|ปิ้งย่าง|บาร์บีคิว|หมูกระทะ|ย่าง)
  sparks_flooding:
    patterns:
      - ประกายไฟ
      - ไฟช็อต
      - ไฟชอร์ต
      - ไฟดูด
      - ไฟฟ้าลัดวงจร
      - ไฟรั่ว
      - สายไฟ(ขาด|เปลือย|โผล่|ชำรุด|ไหม้)
      - น้ำท่วม
      - น้ำล้น
      - น้ำรั่ว(หนัก|เยอะ|มาก|ไม่หยุด)
      - น้ำทะลัก
      - น้ำ(ไหล|หยด|รั่ว)(ลงมา)?จากเพดาน
      - เพดาน(ถล่ม|พัง|ทรุด|ร่วง|จะหล่น)
      - (ท่อแตก|ท่อน้ำแตก|ท่อระเบิด)
  violence:
    patterns:
      - ทำร้าย(ร่างกาย)?
      - ทุบตี
      - ตบตี
      - ชกต่อย
      - ต่อยกัน
      - ตีกัน
      - ทะเลาะวิวาท
      - (ถือ|พก|ชัก|ควง)มีด
      - ขู่ด้วยมีด
      - (ถูก|โดน)แทง
      - แทงด้วยมีด
      - ปืน
      - (ถูก|โดน)ยิง
      - อาวุธ
      - ข่มขู่
      - ขู่ฆ่า
      - ฆ่า
      - ระเบิด
      - ตัวประกัน
      - บุกรุก
      - งัด(ห้อง|ประตู)
      - ปล้น
      - ชิงทรัพย์
      - ข่มขืน
    guards:
      - ปืน(ฉีดน้ำ|ของเล่น|กาว|นวด|วัดไข้|ยิงกาว)
      - ฆ่า(เชื้อ|เวลา|แมลง|ยุง|ตัวตาย)
      - ทำร้ายจิตใจ
      - ยาฆ่า
      - (ปวดหัว|หัว)(จะ)?ระเบิด
      - ระเบิดอารมณ์
  missing_child:
    patterns:
      - (ลูก|เด็ก|ลูกชาย|ลูกสาว|หลาน)(ของ(ฉัน|ผม|เรา|ดิฉัน|หนู))?(หายตัว|หายไป|พลัดหลง|หลงทาง)
      - หา(ลูก|เด็ก|ลูกชาย|ลูกสาว|หลาน)(ของ(ฉัน|ผม|เรา|ดิฉัน|หนู))?ไม่(เจอ|พบ)
      - เด็กหาย(?!ป่วย|ดี|ไข้|ใจ)
      - ลูกหาย(?!ป่วย|ดี|ไข้|ใจ)
  death:
    patterns:
      - (คน|เขา|เธอ|สามี|ภรรยา|แฟน|พ่อ|แม่|ลูก|เพื่อน|แขก|ผู้ชาย|ผู้หญิง)(ได้)?(ตาย|เสียชีวิต)(แล้ว|อยู่)?
      - เสียชีวิต
      - ศพ
      - นอนตาย
      - ตายอยู่
      - สิ้นใจ
      - ฆ่าตัวตาย
      - อยากตาย
    guards:
      - (จะ|แทบ|เกือบ)ตาย
      - (แบต|แบตเตอรี่|มือถือ|โทรศัพท์|โน้ตบุ๊ก)(ตาย|หมด)
      - งานศพ
      - (เขิน|อาย|ขำ)(จน)?อยากตาย
  lift_entrapment:
    patterns:
      - (ติด|ขัง)(อยู่)?ในลิฟ(ต์|ท์)
      - (ฉัน|ผม|เรา|คน|เด็ก|ลูก|แม่|พ่อ|แขก|เพื่อน)(ติด|ค้าง)(อยู่)?ลิฟ(ต์|ท์)
      - ลิฟ(ต์|ท์)(ค้าง|ติด|หยุด)(อยู่)?(ระหว่างชั้น|กลางชั้น)
      - ออกจากลิฟ(ต์|ท์)ไม่ได้
  drugs:
    patterns:
      - ยาเสพติด
      - ยาบ้า
      - ยาไอซ์
      - กัญชา
      - โคเคน
      - เฮโรอีน
      - เฮโรอิน
      - ยาอี(?!ก)
      - เคตามีน
      - ผงขาว
      - (พ่อค้ายา|ค้ายา)
  # ─── Sensitive: urgent, a person now, no public-number card ───
  harassment:
    patterns:
      - ล่วงละเมิด
      - คุกคาม(ทางเพศ)?
      - ลวนลาม
      - ลูบคลำ
      - จับ(ก้น|หน้าอก)
      - แตะต้องตัว
      - สะกดรอย
      - ตามตื๊อ
      - แอบถ่าย
      - กล้องแอบ(ถ่าย|ซ่อน)
      - แอบดู
      - อนาจาร
  theft:
    patterns:
      - (ถูก|โดน)?ขโมย
      - โจร
      - ล้วงกระเป๋า
      - กระชาก(กระเป๋า|สร้อย|โทรศัพท์)
      - (ของ|เงิน|กระเป๋าเงิน|นาฬิกา|โทรศัพท์|มือถือ|แล็ปท็อป|กล้อง)หาย(จาก|ใน)(ห้อง|ตู้เซฟ|เซฟ|กระเป๋า)
      - (ตู้เซฟ|เซฟ)(ถูก)?(งัด|พัง)
      - (ตู้เซฟ|เซฟ)ว่างเปล่า
      - ใครเปิดตู้เซฟ
  lost_document:
    patterns:
      - (หนังสือเดินทาง|พาสปอร์ต|บัตรประชาชน|บัตรประจำตัว|ใบขับขี่|วีซ่า)(ของ(ฉัน|ผม|เรา|ดิฉัน))?(หาย|ถูกขโมย|โดนขโมย|หาไม่เจอ|ไม่เจอ)
      - ทำ(หนังสือเดินทาง|พาสปอร์ต|บัตรประชาชน|บัตรประจำตัว|วีซ่า)หาย
      - หา(หนังสือเดินทาง|พาสปอร์ต|บัตรประชาชน|บัตรประจำตัว)ไม่เจอ
  police:
    patterns:
      - ตำรวจ
      - แจ้งความ
    guards:
      - (สถานีตำรวจ|ป้อมตำรวจ)(ที่)?(ใกล้|อยู่ที่ไหน|อยู่ตรงไหน|ไปยังไง|ไปอย่างไร)
      - (ใกล้|แถว)(ๆ)?(ที่นี่|โรงแรม)?(มี)?(สถานีตำรวจ|ป้อมตำรวจ)
      - (หนัง|ละคร|ซีรีส์)ตำรวจ
      - เสียง(ไซเรน)?(ของ)?(รถ)?ตำรวจ
  # ─── Handoff: a manager takes over; the assistant promises nothing ───
  legal:
    patterns:
      - ทนาย
      - ฟ้อง
      - ดำเนินคดี
      - คดีความ
      - (ขึ้นศาล|ฟ้องศาล)
      - ดำเนินการทางกฎหมาย
  chargeback:
    patterns:
      - (โทร|ติดต่อ|แจ้ง)(หา|ไปที่|ไป)?(ธนาคาร|บริษัทบัตร(เครดิต)?)
      - (ตัดเงิน|หักเงิน|เรียกเก็บเงิน|คิดเงิน|ชาร์จ)(ซ้ำ|สองครั้ง|2 ครั้ง|เกิน)
      - รายการ(ที่)?ไม่ได้(ทำ|อนุญาต)
      - ชาร์จแบ็ก
      - โต้แย้ง(รายการ|ยอด|การเรียกเก็บ)
  refund:
    patterns:
      - คืนเงิน
      - (ขอ|ได้)เงินคืน
      - ค่าชดเชย
      - ชดเชย
      - ชดใช้
    guards:
      - ไม่(สามารถ)?คืนเงิน(ได้)?
      - คืนเงินไม่ได้
  complaint:
    patterns:
      - ร้องเรียน
      - ร้องทุกข์
      - คอมเพลน
      - (คุย|พูด|ติดต่อ|ขอสาย)(กับ)?(ผู้จัดการ|หัวหน้า|เมเนเจอร์|ผู้ดูแล)
      - เรียกผู้จัดการ
      - แย่ที่สุด
      - (บริการ|โรงแรม|ห้อง)(ที่นี่)?แย่มาก
      - ผิดหวัง(มาก|อย่างมาก|จริงๆ|สุดๆ)
      - (รับไม่ได้|ยอมรับไม่ได้)
      - รีวิว(แย่|ไม่ดี|ด่า)
      - ไม่มา(พัก)?อีกแล้ว
    guards:
      - ไม่มี(อะไร)?(จะ|ที่จะ)?ร้องเรียน
      - ไม่มีข้อร้องเรียน
