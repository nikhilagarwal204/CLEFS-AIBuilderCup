# Arabic safety lexicon (MSA and Gulf dialect). Format: see en.yml.
# Arabic attaches clitics to the word ("والحريق" = "and the fire"), so each
# pattern may be preceded by one of the prefixes below; the word boundary on
# the right still stops "مات" (died) matching inside "خدمات" (services).
language: ar
boundary: word
prefix: وال|بال|فال|لل|ال|و|ف|ب|ل|ك
kinds:
  medical:
    patterns:
      - '[اإ]سعاف'
      - نوبة قلبية
      - جلطة
      - سكتة
      - (لا|ما|مو) (ي|ت)تنفس
      - (ضيق|صعوبة) (في )?(ال)?تنفس
      - (فاقد|فقد|فقدت|فاقدة) (ال)?وعي
      - '[اأ]غمي (عليه|عليها|علي)'
      - مغمى (عليه|عليها)
      - نزيف
      - (ي|ت)نزف
      - تشنج(ات)?
      - نوبة صرع
      - (طوارئ|حالة) طبية
      - (احتاج|أحتاج|نحتاج|نبي|ابي|أبي|ابغى|أبغى) (إلى |الى )?(طبيب|دكتور)
      - تسمم
      - حساسية شديدة
      - (ي|ت)ختنق
      - اختناق
      - (ي|ت)غرق
      - غريق
  fire:
    patterns:
      - حريق
      - حريقة
      - نار في
      - دخان كثيف
      - (في|فيه|يوجد|هناك) دخان
      - (رائحة|ريحة) (غاز|حريق|دخان|شي[ءئ]? (ي|ت)حترق)
      - تسر(ب|يب) (ال)?غاز
      - (ي|ت)حترق
      - احتراق
      - (إنذار|انذار|جرس) (ال)?حريق (ي|ت)رن
    guards:
      - مخرج (ال)?حريق
      - (تمرين|تدريب) (ال)?حريق
      - (طفاية|طفايات) (ال)?حريق
      - على (ال)?نار
      - (علبة|باكيت|باكت) دخان
  sparks_flooding:
    patterns:
      - شرار(ة)?
      - ماس كهربا(ئي)?
      - (صعق|صعقة|صعقني|كهربني) (كهربائي|كهربائية|كهربا)?
      - '[اأ]سلاك (مكشوفة|عارية)'
      - فيضان
      - (غرقت|غرق) (ال)?غرفة
      - (الماء|المياه|المية|الماي) في كل مكان
      - انفجار (ال)?(ماسورة|[اأ]نبوب|بايب)
      - (ال)?سقف (ي|ت)(سقط|نهار)
  violence:
    patterns:
      - هجوم
      - هاجم(ني|نا|وني|ه|ها)
      - اعتداء
      - اعتدى
      - (ضربني|يضربني|يضربها|يضربه|ضربوني)
      - (معه|معاه|يحمل|ماسك) (سكين|سلاح|مسدس)
      - مسدس
      - سلاح
      - (هددني|يهددني|تهديد)
      - (سيقتلني|بيقتلني|يقتلني|راح يقتل|بقتل)
      - قنبلة
      - '[اإ]طلاق (ال)?نار'
      - طعن(ه|ني|ها)?
      - اغتصاب
      - (مشاجرة|مضاربة|عراك|هوشة)
      - (ي|ت)تقاتلون
      - دخيل
      - اقتحام
  missing_child:
    patterns:
      - (طفلي|ابني|بنتي|ابنتي|ولدي|طفلتي|[اأ]طفالي|عيالي) (مفقود|مفقودة|ضايع|ضايعة|ضاع|ضاعت|اختفى|اختفت)
      - (لا [اأ]جد|ما لقيت|مو لاقي|ما [اأ]لقى) (طفلي|ابني|ابنتي|بنتي|ولدي|[اأ]طفالي|عيالي)
      - (طفل|طفلة) مفقود(ة)?
  death:
    patterns:
      - ميت
      - ميتة
      - (توفي|توفى|توفيت)
      - (مات|ماتت)
      - جثة
      - انتحار
      - (ي|ت)نتحر
      - ([اأ]ريد|ابي|أبي|بدي) ([اأ]ن )?[اأ]موت
    guards:
      - (البطارية|الجوال|التلفون|الهاتف|الشاحن|الريموت|الموبايل) (مات|ماتت|ميت|ميتة|فاضي|فاضية)
      - (ميت|ميتة|ميتين) (من )?(ال)?(جوع|تعب|ضحك|برد|حر|عطش|نوم|ملل)
  lift_entrapment:
    patterns:
      - (عالق|عالقين|عالقة|محبوس|محبوسين|محبوسة|محتجز|محتجزين) (في|داخل) (ال)?(مصعد|اسانسير|أسانسير|ليفت)
      - (علقت|علقنا|انحبست|انحبسنا) (في|داخل) (ال)?(مصعد|اسانسير|أسانسير|ليفت)
  drugs:
    patterns:
      - مخدرات
      - مخدر
      - حشيش
      - كوكايين
      - هيروين
      - حبوب مخدرة
  harassment:
    patterns:
      - (تحرش|تحرّش|يتحرش|تحرشات)
      - (لمسني|لمسها|يلمسني)
      - (يلاحقني|يتبعني|يراقبني)
      - كاميرا (مخفية|سرية)
  theft:
    patterns:
      - سرقة
      - (سرق|سرقوا|انسرق|انسرقت)
      - (مسروق|مسروقة)
      - حرامي
      - لص
  lost_document:
    patterns:
      - (ضاع|ضايع|فقدت|فقد|[اأ]ضعت|ضيعت) (ال)?(جواز|جوازي|جواز السفر|هوية|هويتي|بطاقة الهوية|[اإ]قامة|[اإ]قامتي|تأشيرة|التأشيرة)
      - (جواز|جوازي|جواز السفر|هويتي) (ضاع|مفقود|ضايع|انسرق)
  police:
    patterns:
      - شرطة
      - بوليس
  legal:
    patterns:
      - محامي
      - محكمة
      - دعوى
      - (سأقاضي|ساقاضي|راح اشتكي عليكم في المحكمة)
      - '[اإ]جراءات قانونية'
  chargeback:
    patterns:
      - اعتراض على (ال)?(دفع|خصم|عملية)
      - ([اا]نخصم|خصم|خصموا) (مني )?مرتين
      - (سأتصل|ساتصل|بتصل|راح اتصل) (ب|على )(ال)?بنك
  refund:
    patterns:
      - استرداد
      - استرجاع (ال)?(مبلغ|فلوس|[اأ]موال)
      - ([اأ]ريد|ابي|أبي|ابغى|أبغى) فلوسي
      - تعويض
  complaint:
    patterns:
      - شكوى
      - '[اأ]شتكي'
      - ([اأ]ريد|ابي|أبي|ابغى|أبغى|[اأ]بغا) (ال)?مدير
      - غير مقبول
      - (سيئ|سيء) جدا
