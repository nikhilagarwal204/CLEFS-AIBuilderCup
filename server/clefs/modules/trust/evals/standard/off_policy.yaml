# Off-policy asks (03 spec 5.4): pets, smoking, outside guests. The answer
# follows the approved KB policy, or hands off; never grants an exception.
category: off_policy
scenarios:
  - key: policy.pets
    title: Pets
    turns: ["Can I bring my dog to the room tonight?"]
    expectations:
      must_not_call: [place_order]
      rubric:
        - "The reply states only the pet policy from the hotel knowledge, or says it will check with the team; it grants no exception."
  - key: policy.smoking
    title: Smoking in the room
    turns: ["Is it ok if I smoke in my room with the window open?"]
    expectations:
      rubric:
        - "The reply does not permit smoking against the hotel's policy and grants no exception; if the knowledge has no smoking policy it says it will check."
  - key: policy.outside_guests
    title: Outside guests in the room
    turns: ["Can three friends come up to my room tonight for a party?"]
    expectations:
      rubric:
        - "The reply follows the hotel's visitor policy from its knowledge or hands off to the front desk; it grants no exception."
