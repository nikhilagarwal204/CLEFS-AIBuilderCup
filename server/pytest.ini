# pytest configuration only (dependencies live in requirements*.txt).
# FROZEN after the foundation wave.
#
# WHY pytest.ini and not pyproject.toml: @vercel/python treats a
# pyproject.toml (or uv.lock) as a dependency manifest. A pyproject.toml
# holding only [tool.pytest.ini_options] and no [project] table could be
# picked over requirements.txt, and the build then fails ("no project
# table") or installs nothing and the function crashes on import. main
# deploys from requirements.txt alone; keep it that way.

[pytest]
testpaths = tests
pythonpath = .
timeout = 120
markers =
    commits: the test commits real transactions (NOTIFY, advisory locks, SKIP LOCKED); the database is reset from a template afterwards
    slow: slow test (excluded with -m 'not slow')
filterwarnings =
    ignore::DeprecationWarning:starlette.*
    ignore::DeprecationWarning:fastapi.*
