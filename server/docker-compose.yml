# Local or single-VM stack: Postgres 16, the API, the background worker and,
# on the UAE-resident VM topology, Caddy for TLS (01 spec G).
#   docker compose up --build                   # laptop: http://localhost:8000
#   API_DOMAIN=api.clefs.world docker compose --profile tls up -d --build   # VM
# The API runs pending migrations before it starts (the Procfile release step).
#
# Secrets go in .env.compose (git- and docker-ignored): at least SECRET_KEY
# (32+ random chars). The API refuses the public development key unless
# ENV=development is set there, which is only for a laptop.
#
# Only Caddy listens on public interfaces. Postgres and the API bind to the
# host's loopback, so the X-Forwarded-For that uvicorn trusts
# (FORWARDED_ALLOW_IPS) can only come from Caddy, which overwrites it.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: clefs
      POSTGRES_PASSWORD: clefs
      POSTGRES_DB: clefs
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clefs -d clefs"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    env_file:
      - path: .env.compose
        required: false
    environment:
      DATABASE_URL: postgresql://clefs:clefs@postgres:5432/clefs
      DATABASE_URL_UNPOOLED: postgresql://clefs:clefs@postgres:5432/clefs
      EVENTS_BACKEND: notify
      CLEFS_DOTENV: "0"
      PORT: "8000"
      # Read by uvicorn --proxy-headers: only peers on this private network
      # (Caddy) can reach the API, since the host port below is loopback-only.
      FORWARDED_ALLOW_IPS: "*"
    command: ["sh", "-c", "python -m clefs.migrate up && uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers --timeout-graceful-shutdown 10"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build: .
    env_file:
      - path: .env.compose
        required: false
    environment:
      DATABASE_URL: postgresql://clefs:clefs@postgres:5432/clefs
      DATABASE_URL_UNPOOLED: postgresql://clefs:clefs@postgres:5432/clefs
      EVENTS_BACKEND: notify
      CLEFS_DOTENV: "0"
    command: ["python", "-m", "clefs.worker"]
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2
    profiles: ["tls"]
    environment:
      API_DOMAIN: ${API_DOMAIN:-api.clefs.world}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
